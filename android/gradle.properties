android.useAndroidX=true
android.enableJetifier=false

# R8 full-mode on a Compose app is the memory-hungry step of the release build;
# 2 GB was enough for debug but OOM-ed (or thrashed) minifying release. 4 GB heap
# plus an explicit metaspace cap keeps bundlePlayRelease comfortable.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

kotlin.code.style=official

# Explicit rather than relying on the AGP 8 default, so a future AGP change cannot
# silently re-enable the transitive R class and bloat the release dex.
android.nonTransitiveRClass=true

# R8 full mode: stronger optimisation/shrinking for the release artifact. It is the
# AGP 8 default; stated here because the Play build depends on it actually removing
# the dead UPDATE_CHECK_ENABLED branch and its strings.
android.enableR8.fullMode=true
