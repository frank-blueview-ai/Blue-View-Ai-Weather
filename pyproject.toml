[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name            = "blueview-weather"
version         = "1.0.0"
description     = "Floating/dockable weather panel for Linux with live radar — no API key needed"
readme          = "README.md"
license         = { file = "LICENSE" }
requires-python = ">=3.10"
authors         = [{ name = "Frank Perez", email = "frank@blueview.ai" }]
keywords        = ["weather", "qt", "linux", "radar", "dock"]
classifiers     = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]
dependencies = [
    "PyQt6>=6.4",
    "PyQt6-WebEngine>=6.4",
]

[project.urls]
Homepage   = "https://github.com/frank-blueview-ai/BlueView-Weather"
Repository = "https://github.com/frank-blueview-ai/BlueView-Weather"

[project.scripts]
blueview-weather = "blueview_weather:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"blueview_weather" = ["*.svg"]
