name: Build Android APK & AAB

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Fail loudly if the signing secrets are absent. Without this the decode
      # below silently writes an empty file, and the build either dies with an
      # opaque keytool error or ships an APK signed with an ephemeral debug key
      # that cannot upgrade the previous install.
      - name: Verify signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ]   || missing="$missing KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || missing="$missing KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]      || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secret(s):$missing"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/blueview-release.jks
          test -s keystore/blueview-release.jks || { echo "::error::Decoded keystore is empty"; exit 1; }

      # The APK published to users is now the minified GITHUB-flavour RELEASE build.
      # It used to be the debug build, which ships android:debuggable — that lets
      # anyone with adb access to a user's device read the app's private data.
      - name: Build GitHub release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleGithubRelease --no-daemon

      # The Play flavour compiles out the in-app updater (Play forbids an app
      # distributed there from updating itself outside Play).
      - name: Build Play AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundlePlayRelease --no-daemon

      - name: Verify published APK is signed and not debuggable
        run: |
          APK=app/build/outputs/apk/github/release/app-github-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" \
            || { echo "::error::Published APK is not validly signed"; exit 1; }
          if "$BT/aapt" dump badging "$APK" | grep -q "^application-debuggable"; then
            echo "::error::Published APK is debuggable — refusing to release it"; exit 1
          fi
          echo "APK is signed and not debuggable."

      - name: Verify Play AAB carries no updater
        run: |
          AAB=app/build/outputs/bundle/playRelease/app-play-release.aab
          test -s "$AAB" || { echo "::error::Play AAB missing"; exit 1; }
          # The Play build must not contain the GitHub releases endpoint. If this
          # string survives, the updater was not compiled out and Play's Device and
          # Network Abuse policy is in play.
          if unzip -p "$AAB" base/dex/*.dex 2>/dev/null | strings | grep -q "api.github.com/repos"; then
            echo "::error::Play AAB still references the GitHub releases API"; exit 1
          fi
          echo "Play AAB is clean of the updater."

      - name: Upload GitHub release APK
        uses: actions/upload-artifact@v4
        with:
          name: github-release-apk
          path: android/app/build/outputs/apk/github/release/app-github-release.apk

      # Kept as a private CI artifact, NOT attached to the public release: this is
      # the artifact uploaded to the Play Console.
      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: play-release-aab
          path: android/app/build/outputs/bundle/playRelease/app-play-release.aab

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/github/release/app-github-release.apk
