name: BlueViewWeather
options:
  bundleIdPrefix: ai.blueview
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  BlueViewWeather:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: BlueViewWeather
    info:
      path: BlueViewWeather/App/Info.plist
      properties:
        CFBundleDisplayName: Blue View Weather
        # Without these the plist keeps XcodeGen's literal 1.0/1 and MARKETING_VERSION
        # never reaches the bundle, so About and the update check read a stale version.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # App only uses HTTPS via URLSession/WKWebView — i.e. the TLS built into
        # iOS, no encryption of its own. Declaring this here means App Store
        # Connect stops asking the export-compliance question on every build.
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "Blue View Weather uses your location to show the forecast and radar for where you are."
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [armv7]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.blueview.weather
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: "LDYV28TV5T"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: ""
